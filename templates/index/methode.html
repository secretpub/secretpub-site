<!-- QUI SOMMES-NOUS (aperçu). Remplace la méthode en 4 étapes, retirée le 12/11/2026 à la demande d'Isaac.
     L'id « methode » est gardé : le bouton flottant « Demander un devis » (site.js) et les anciens liens /#methode s'en servent. -->
{{#about.teaser}}
<section class="section methode apropos" id="methode" data-screen-label="Qui sommes-nous">
  <div class="wrap">
    <div class="section-head reveal center">
      <span class="eyebrow">{{eyebrow}}</span>
      <h2>{{title}}</h2>
      <p class="lead">{{lead}}</p>
    </div>
    <div class="about-facts reveal">
      {{#facts}}
      <div class="about-fact"><div class="n">{{n}}</div><div class="l">{{label}}</div></div>
      {{/facts}}
    </div>
    <p class="about-cta reveal"><a class="btn btn-primary btn-lg" href="/qui-sommes-nous">{{ctaLabel}} <span class="arr">→</span></a></p>
  </div>
</section>
{{/about.teaser}}
